name: Build PULS 512 beta

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test verification backend
        run: npm test --prefix backend

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -PPULS512_API_BASE_URL="${{ vars.PULS512_API_BASE_URL }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PULS512-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
