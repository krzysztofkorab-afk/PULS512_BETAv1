    <text x="48" y="470" class="font white bold" font-size="15">Najważniejszy temat dnia</text>
    <text x="48" y="493" class="font white bold" font-size="15">w krótkim podsumowaniu</text>
    <text x="48" y="521" class="font muted" font-size="11">Dwa zdania faktów, bez zbędnego szumu</text>
    <text x="48" y="540" class="font muted" font-size="11">i z bezpośrednim linkiem do źródła.</text>
    <text x="48" y="559" class="font mint bold" font-size="9">ŹRÓDŁA (2)   ◆ Eurostat   ↗ BBC</text>
