    <text x="182" y="628" class="font muted" font-size="16">◷</text><text x="172" y="650" class="font muted" font-size="10">Plan</text>
    <text x="292" y="628" class="font muted" font-size="15">✦</text><text x="278" y="650" class="font muted" font-size="10">Uwagi</text>
