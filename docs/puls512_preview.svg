<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#102633"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73DBFF"/><stop offset="1" stop-color="#69E1BA"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <style>
      .font{font-family:Inter,Arial,sans-serif}.white{fill:#F4FAFD}.muted{fill:#93A7B4}.ice{fill:#73DBFF}.mint{fill:#69E1BA}.bold{font-weight:700}.black{font-weight:900}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="240" fill="#73DBFF" opacity=".035"/><circle cx="1280" cy="760" r="320" fill="#69E1BA" opacity=".035"/>
  <text x="70" y="74" class="font white black" font-size="32" letter-spacing="3">PULS 512</text>
  <text x="70" y="106" class="font muted" font-size="16">Twój świat. Dwa razy dziennie. • Beta UI</text>

  <!-- phone 1 -->
  <g transform="translate(75 145)">
    <rect width="370" height="680" rx="42" fill="#050B10" stroke="#294252" stroke-width="2"/>
    <rect x="15" y="15" width="340" height="650" rx="31" fill="#071018"/>
