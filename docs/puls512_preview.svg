    <rect x="30" y="352" width="310" height="44" rx="20" fill="#73DBFF"/><text x="101" y="379" class="font black" font-size="12" fill="#071018">WYŚLIJ UWAGĘ TEKSTOWĄ</text>
    <line x1="30" y1="430" x2="340" y2="430" stroke="#213846"/>
    <text x="34" y="465" class="font ice bold" font-size="10" letter-spacing="1.5">WIADOMOŚĆ GŁOSOWA</text>
