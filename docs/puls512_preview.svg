    <text x="48" y="313" class="font ice bold" font-size="10" letter-spacing="1.5">WIECZORNY PULS</text><text x="48" y="334" class="font muted" font-size="10">Najważniejsze wydarzenia całego dnia</text>
    <rect x="270" y="302" width="48" height="25" rx="13" fill="#164E50"/><circle cx="305" cy="314.5" r="10" fill="#69E1BA"/>
    <rect x="262" y="340" width="62" height="31" rx="10" fill="#132431"/><text x="274" y="361" class="font mint black" font-size="15">19:00</text>
