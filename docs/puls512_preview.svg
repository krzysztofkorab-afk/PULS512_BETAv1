    <g class="font" font-size="11"><rect x="30" y="443" width="94" height="35" rx="17" fill="#123849" stroke="#73DBFF"/><text x="48" y="465" class="ice bold">✓  Polska</text><rect x="132" y="443" width="94" height="35" rx="17" fill="#123849" stroke="#73DBFF"/><text x="148" y="465" class="ice bold">✓  Europa</text><rect x="234" y="443" width="106" height="35" rx="17" fill="#123849" stroke="#73DBFF"/><text x="249" y="465" class="ice bold">✓  Świat</text><rect x="30" y="487" width="104" height="35" rx="17" fill="#123849" stroke="#73DBFF"/><text x="46" y="509" class="ice bold">✓  Biznes</text><rect x="142" y="487" width="130" height="35" rx="17" fill="#0D1923" stroke="#294252"/><text x="160" y="509" class="muted">+  Technologia</text></g>
    <text x="34" y="561" class="font ice bold" font-size="10" letter-spacing="1.5">FILTR WIARYGODNOŚCI</text>
    <rect x="30" y="576" width="310" height="62" rx="18" fill="#0D1923"/><text x="48" y="603" class="font white bold" font-size="12">Tylko potwierdzone</text><text x="48" y="621" class="font muted" font-size="9">Dane pierwotne lub co najmniej 2 źródła</text><rect x="276" y="592" width="44" height="24" rx="12" fill="#164E50"/><circle cx="307" cy="604" r="9" fill="#69E1BA"/>
  </g>

  <!-- phone 3 -->
  <g transform="translate(955 145)">
    <rect width="370" height="680" rx="42" fill="#050B10" stroke="#294252" stroke-width="2"/>
    <rect x="15" y="15" width="340" height="650" rx="31" fill="#071018"/>
