    <text x="34" y="170" class="font white black" font-size="24">Najważniejsze.</text><text x="34" y="198" class="font white black" font-size="24">Bez szumu.</text>
    <rect x="30" y="221" width="310" height="145" rx="22" fill="#132431"/>
    <circle cx="51" cy="247" r="5" fill="#69E1BA"/><text x="64" y="251" class="font mint bold" font-size="12">Briefing gotowy</text><text x="297" y="251" class="font muted" font-size="11">07:02</text>
    <text x="48" y="282" class="font muted" font-size="12">6 informacji • około 4 min słuchania</text>
    <rect x="46" y="308" width="158" height="38" rx="18" fill="#73DBFF"/><text x="78" y="332" class="font black" font-size="12" fill="#071018">▶  ODSŁUCHAJ</text>
    <rect x="214" y="308" width="108" height="38" rx="18" fill="none" stroke="#365362"/><text x="238" y="332" class="font white bold" font-size="11">ODŚWIEŻ</text>
